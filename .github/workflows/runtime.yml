name: Runtime checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: npm
      - run: npm install --global npm@11.11.0
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=low
      - run: sudo apt-get update && sudo apt-get install -y bubblewrap util-linux apparmor
      - run: bwrap --version && /usr/bin/prlimit --version
      - name: Start the disposable runner's user resource manager
        run: |
          apd_uid=$(id -u)
          sudo systemctl start "user@${apd_uid}.service"
          XDG_RUNTIME_DIR="/run/user/${apd_uid}" DBUS_SESSION_BUS_ADDRESS="unix:path=/run/user/${apd_uid}/bus" systemctl --user is-active default.target
          systemd-run --version
      - name: Configure the CI sandbox executable's user namespace permission
        run: |
          if test -r /proc/sys/kernel/apparmor_restrict_unprivileged_userns; then
            sudo install -m 0644 .github/apparmor/agent-driver-bwrap /etc/apparmor.d/agent-driver-bwrap
            sudo apparmor_parser --replace /etc/apparmor.d/agent-driver-bwrap
            sysctl kernel.apparmor_restrict_unprivileged_userns
          fi
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: runtime-evidence
          path: |
            tests/evidence/runtime-tests-*.json
            tests/report.json
          if-no-files-found: warn
